{%- assign p = site.data.profile -%}
<ul class="social">
    <li><a href="mailto:{{ p.email }}"><i class="fa-solid fa-envelope" aria-hidden="true"></i><span>Email</span></a></li>
    <li><a href="{{ p.github }}" rel="noopener"><i class="fa-brands fa-github" aria-hidden="true"></i><span>GitHub</span></a></li>
    <li><a href="{{ p.gscholar }}" rel="noopener"><i class="fa-brands fa-google-scholar" aria-hidden="true"></i><span>Google Scholar</span></a></li>
    <li><a href="{{ p.linkedin }}" rel="noopener"><i class="fa-brands fa-linkedin" aria-hidden="true"></i><span>LinkedIn</span></a></li>
    <li><a href="{{ p.orcid }}" rel="noopener"><i class="fa-brands fa-orcid" aria-hidden="true"></i><span>ORCID</span></a></li>
</ul>
