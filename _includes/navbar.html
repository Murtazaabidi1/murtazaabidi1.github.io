<header class="site-header">
    <nav class="container nav" aria-label="Primary">
        <a class="nav-brand" href="{{ '/' | relative_url }}">{{ site.data.profile.navbar_name }}</a>
        <ul class="nav-menu" id="nav-menu">
            {% for item in site.data.navigation.pages %}
            <li>
                <a href="{{ item.url | relative_url }}"{% if item.name == page.navbar_title %} aria-current="page"{% endif %}>{{ item.name }}</a>
            </li>
            {% endfor %}
        </ul>
        <div class="nav-actions">
            <button class="icon-btn theme-toggle" type="button" aria-pressed="false" aria-label="Dark mode" title="Switch to dark mode">
                <i class="fa-solid fa-moon" aria-hidden="true"></i>
                <i class="fa-solid fa-sun" aria-hidden="true"></i>
            </button>
            <button class="icon-btn nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
                <span class="nav-toggle-bar" aria-hidden="true"></span>
                <span class="sr-only">Menu</span>
            </button>
        </div>
    </nav>
</header>
