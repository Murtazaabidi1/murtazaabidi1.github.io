{%- assign p = site.data.profile -%}
<footer class="site-footer">
    <div class="container footer-inner">
        <p>&copy; {{ site.time | date: "%Y" }} {{ p.primary_name }} · {{ p.location }}</p>
        <p class="footer-links">
            <a href="mailto:{{ p.email }}">Email</a>
            <a href="{{ p.github }}" rel="noopener">GitHub</a>
            <a href="{{ p.gscholar }}" rel="noopener">Google Scholar</a>
            <a href="{{ p.linkedin }}" rel="noopener">LinkedIn</a>
        </p>
    </div>
</footer>
