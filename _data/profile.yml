short_bio: >-
  <p>
  I am an R&D AI Scientist at ROSAIC.ai, where I conduct research on Physical AI and intelligent robotic manipulation. My research focuses on Vision-Language-Action (VLA), Vision-Force-Language-Action (VFLA), PrimitiveVLA, and Physics-Informed VLAs for contact-rich manipulation. I develop multimodal robotic learning systems that integrate vision, force, and tactile sensing, while exploring foundation models, long-horizon manipulation, manipulation-oriented world models, multimodal dataset creation, and sim-to-real learning using NVIDIA Isaac Sim.
  </p>

