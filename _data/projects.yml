  sensors: ["TSF-85 tactile — future integration, not modeled"]
  stack: [ROS 2 Humble, MoveIt 2, RViz2, ros2_control, OMPL, Pilz, URDF / Xacro, Python]
  metrics:
    - { value: "627 / 0", label: "automated test results / failures" }
