# ---------------------------------------------------------------------------
# Featured research projects (rendered in this order). Add a project by
# appending an entry.
#
# Fields
#   id           anchor id (used in URLs: /projects.html#<id>)
#   title        project name
#   tagline      one-line subtitle
#   featured     true → shown on the homepage
#   card_summary homepage card text (~30–45 words, plain language)
#   card_platform homepage card platform line
#   status       list of { label, kind }  kind: real | sim | ongoing | info
#   objective    technical objective (projects page)
#   highlights   implementation bullets (projects page; may contain <strong>)
#   results      key-result notes / status distinctions (projects page)
#   pipeline     optional list of stage names, shown as a flow (projects page only)
#   platform     robots / platforms
#   sensors      optional, sensors and end effectors
#   stack        frameworks and technologies
#   metrics      list of { value, label }  — only documented results
#   note         evaluation-context caveat (projects page only)
#   image        optional { src, alt } — only authorised, non-confidential images
#   links        optional list of { label, url } — only public links
#   confidential true → shows the "source code is private" notice
#
# CONFIDENTIALITY: LG Grasping KPI, NACHI MoveIt 2 and Hybrid VFLA are private
# repositories. Never add source links, internal IPs, proprietary assets, or
# upstream robot meshes/CAD (NACHI mesh redistribution is unconfirmed).
# ---------------------------------------------------------------------------

- id: lg-grasping-kpi
  title: "LG Grasping KPI"
  tagline: "Industrial cable manipulation"
  featured: true
  card_summary: >-
    Developed a ROS 2-based cable-grasping system on the physical NACHI MZ07, integrating multimodal sensing and a real-time dashboard for grasp monitoring and evaluation.
  card_platform: "NACHI MZ07 · Robotiq 2F-85"
  confidential: true
  status:
    - { label: "Completed", kind: real }
    - { label: "Real-robot validated", kind: real }
  objective: >-
    Build a supervised, instrumented cable-grasping cell on the industrial NACHI MZ07 and evaluate grasp
    success on real hardware.
  highlights:
    - "Supervised cable-grasp sequence executed on the physical NACHI MZ07: approach, close with contact check, lift and hold, retention check, release, and automatic return to HOME."
    - "Robotiq 2F-85 integration with status monitoring and interlocked open/close commands."
    - "Synchronized observation: AFT200 force/torque at 200 Hz, TSF-85 tactile visualization, and wrist + overhead RealSense D455 RGB-D streams."
    - "Real-time web dashboard for robot supervision, sensor monitoring, trial control, and per-trial evaluation records."
    - "ROS 2 integration through the NACHI HWIF / External Tracking interface with safety-gated, supervised execution."
  platform: [NACHI MZ07, NACHI FD Controller]
  sensors: [Robotiq 2F-85, AFT200 six-axis F/T, TSF-85 tactile, 2× RealSense D455]
  stack: [ROS 2, NACHI NKR ROS 2 API, HWIF / External Tracking, Python, C++, KPI dashboard]
  # 94.5% is the owner-confirmed final result (2026-11-21). Do not add trial counts
  # or evaluation conditions unless the owner provides them.
  metrics:
    - { value: "94.5%", label: "Grasp-success rate" }

- id: nachi-moveit2
  title: "NACHI MZ07 + MoveIt 2"
  tagline: "Motion planning and virtual grasping"
  featured: true
  card_summary: >-
    Developed a ROS 2 / MoveIt 2 framework for collision-aware motion planning, mock trajectory execution, and virtual cable-grasping demonstrations.
  card_platform: "NACHI MZ07 · MoveIt 2 (Simulation)"
  confidential: true
  status:
    - { label: "Simulation-validated", kind: sim }
  objective: >-
    Provide a collision-aware ROS 2 Humble / MoveIt 2 planning and virtual-grasping environment for the NACHI MZ07
    with a Robotiq 2F-85, ahead of physical integration.
  highlights:
    - "Unified NACHI MZ07-01, custom cylindrical adapter, and Robotiq 2F-85 description in URDF/Xacro, with joint and coordinate-frame modeling."
    - "Inverse kinematics and collision-aware planning with self- and environment-collision checking (OMPL and Pilz Cartesian planners)."
