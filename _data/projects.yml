    - { value: "≤ 0.085 mm", label: "mock-execution TCP endpoint error" }

- id: hybrid-vfla
  title: "Hybrid Dual VFLA"
  tagline: "Force-aware robotic manipulation"
  featured: true
  card_summary: >-
    Developed a dual-system manipulation framework: deterministic System 1 control with bounded, force-aware System 2 residual corrections, safety supervision, and live RGB and force/torque monitoring in NVIDIA Isaac Sim.
  card_platform: "Doosan E0509 · NVIDIA Isaac Sim"
  confidential: true
  status:
    - { label: "Simulation-validated", kind: sim }
  objective: >-
    Combine a validated deterministic controller with learned, bounded force-aware corrections for contact-rich
    fixture seating, without giving up the safety of the nominal motion.
  highlights:
    - "<strong>System 1</strong>: deterministic nominal control that completes the placement on its own."
    - "<strong>System 2</strong>: learned force-aware policy (FMT, trained on RGB + six-axis F/T) that proposes residual corrections to the nominal trajectory."
    - "<strong>Residual bridge, supervisor, and safety layer</strong>: contact-state arbitration, bounded corrective actions in the tool frame, and independent safety checks; observation and action interfaces pinned by versioned contracts."
    - "<strong>Isaac Sim workcell</strong>: Doosan E0509 + Robotiq 2F-85 with two RGB streams and six-axis F/T, PhysX contact, and fixture-seating detection."
    - "<strong>Hybrid monitor</strong>: live RGB views, F/T graphs, robot and control state, and contact status during simulated execution."
    - "<strong>Corrective-teacher recovery</strong> under X/Y/yaw misalignment, used to generate demonstrations for learning System 2."
    - "Integration of the physical Doosan A0509 (a separate platform from the simulated E0509) is in progress."
  metrics:
    - { value: "50/50", label: "successful nominal System 1 demonstrations" }
    - { value: "500", label: "FMT training epochs; shadow inference passed" }
    - { value: "±1.5 mm · ±2.0 mm · ±3°", label: "teacher-recovery envelope (X · Y · yaw)" }
  results:
    - "Zero-residual execution reproduces System 1 byte-identically; supervisor, residual bridge, and safety layer were tested with a mock System 2."
    - "As of the October 2026 review, the trained System 2 ran in shadow mode with zero execution authority. Learned corrective execution is the next milestone."
  platform: [Doosan E0509 (NVIDIA Isaac Sim), Robotiq 2F-85 (simulated)]
  sensors: [2× RGB cameras (simulated), Six-axis force/torque (simulated)]
  stack: [VFLA, Residual learning, System 1 / System 2, Isaac Sim, PhysX, PyTorch]

- id: vision-force-ablation
  title: "Vision–Force Ablation"
  tagline: "RGB-only vs. RGB+force · multimodal interpretability"
  featured: true
  card_summary: >-
    Built a true RGB-only VFLA baseline by removing force modules, compared it with RGB+force, and used attention analysis to diagnose an incorrect target-selection failure.
  card_platform: "Franka FR3 · Vision–Force Learning"
  status:
    - { label: "Controlled study", kind: info }
  objective: >-
    Establish a verified vision–force baseline: measure what force input actually contributes, confirm how image and
    force signals are processed, and explain policy failures.
  highlights:
    - "<strong>True force ablation</strong>: added explicit force on/off control and removed force modules from the RGB-only model, instead of zero-filling F/T inputs; validated both configurations and checkpoint compatibility."
    - "<strong>Architecture investigation</strong>: traced DINOv2 visual encoding and image–force cross-attention, and verified token dimensions and action sensitivity."
    - "<strong>Findings</strong>: attention collapse under high-force observations, padding leakage, and preprocessing inconsistencies between data collection, training, and deployment; corrective tasks distributed across the VFLA team to stabilize the baseline."
    - "<strong>Failure analysis</strong>: in a plug-insertion task, the policy selected the wrong socket. Built architecture and attention visualizations to trace visual processing and diagnose the incorrect target selection."
  metrics:
    - { value: "14.80M", label: "parameters removed (12.14%): 121.96M → 107.16M" }
    - { value: "11/11", label: "ablation validation tests passed" }
    - { value: "1,024 + 8", label: "image + force tokens verified" }
    - { value: "427/427", label: "checkpoint tensors loaded (RGB+force)" }
  results:
    - "Both configurations trained for 500 epochs; task success is evaluated separately."
    - "The target-selection failure was diagnosed; its correction has not yet been verified."
  platform: [Franka FR3]
  sensors: [RGB, Force/torque]
  stack: [VFLA, DINOv2, Cross-attention, Ablation study, Attention visualization, PyTorch]

- id: franka-nachi-integration
  title: "Franka–NACHI Integration"
  tagline: "Real-robot execution and multi-robot architecture"
  featured: true
  card_summary: >-
    Executed VFLA policy-generated trajectories on the real NACHI MZ07 through ROS 2 pose conversion, chunked 200 Hz command transport, and feedback re-anchoring; designed a reusable multi-robot execution architecture.
  card_platform: "Franka FR3 · NACHI MZ07"
  status:
    - { label: "Real-robot execution", kind: real }
  objective: >-
    Run VFLA policy actions, generated in Franka conventions, on the industrial NACHI MZ07, and define a
    robot-independent architecture for future robot integration.
  highlights:
    - "<strong>Command integration</strong>: converted Franka pose7 to NACHI pose6, implemented ROS 2 command-chunk transport and sequencing, and re-anchored trajectories on live robot-state feedback."
    - "<strong>Hardware validation</strong>: 200 Hz (5 ms) execution gated by NACHI HWIF safety; staged supervised runs of 4, 6, 8, and 10 chunks."
    - "<strong>Fault investigation</strong>: diagnosed queue and restart issues and the E1998 controller fault; improved retry handling, command freshness, and activation."
    - "<strong>Multi-robot architecture (design)</strong>: canonical observation contracts, robot-independent action representation, an execution manager, robot-specific adapters, and shared validation and safety interfaces in ROS 2, with an implementation roadmap."
  metrics:
    - { value: "10/10", label: "command chunks · 800/800 ticks executed" }
    - { value: "200 Hz", label: "command interface with HWIF safety gating" }
    - { value: "≈106.5 ms", label: "observed target-to-feedback tracking lag" }
  results:
    - "Results measure command execution and controller tracking, not manipulation task success."
    - "Longer trajectories still triggered the E1998 controller fault."
    - "The multi-robot architecture is a delivered design and roadmap, not yet a fully implemented platform."
  platform: [NACHI MZ07, Franka FR3 (action source)]
  stack: [ROS 2, NACHI HWIF, Pose conversion, Chunked command transport, Robot adapters]

