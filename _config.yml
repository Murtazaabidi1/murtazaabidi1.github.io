# Site settings
title: "Murtaza Hussain"
description: >-
  Murtaza Hussain — Physical AI Model Team Lead at ROSAIC.ai, Seoul. Research on
  Vision-Language-Action models, force-aware robotic manipulation, and multimodal robot learning.
url: "https://murtazaabidi1.github.io"
baseurl: ""
lang: en

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Files that must not be published. Note: setting `exclude` replaces Jekyll's
# defaults, so the usual Ruby/Bundler entries are listed here too.
exclude:
  - CV/main.tex          # CV source (contains unpublished/commented-out material)
  - "CV/Murtaza 3-Month-Presentation --English.pdf"   # internal ROSAIC review — never publish
  # Anonymized double-blind review copies — not to be distributed while under review.
  - assets/papers/EdgeDAM_CVPR_2026_.pdf
  - assets/papers/CylindMamba.pdf
  - files/CylinMamba3D.pdf
  - fav-icon.png            # favicon source; sized copies live in assets/favicon/
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - blogs.html           # template demo pages (kept in the repo, not built)
  - showcase.html
  - _layouts/blog.html

collections:
  publications:
    output: true
  # Template demo collections: kept in the repo but no longer published.
  blogs:
    output: false
  news:
    output: false
  showcase:
    output: false

defaults:
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
